name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The fast checks: types, tests on the in-memory database, the dashboard build, the docs.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Tests use the in-memory database and scripted mock models.
      # No API keys are set, so CI never calls a real model.
      DB_MODE: memory
      MOCK_LLM: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build the dashboard
        run: npm run build

      - name: Docs check
        run: npm run docs:check

  # The same server tests, against a real Postgres, because that is what GateX runs on.
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MOCK_LLM: '1'
      TEST_DATABASE_URL: postgres://ddd:ddd@localhost:5432/ddd
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ddd
          POSTGRES_PASSWORD: ddd
          POSTGRES_DB: ddd
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ddd -d ddd"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Server tests on Postgres
        run: npm test -w server

  # Builds the real image, starts it, runs one whole check through it and keeps the report it produced.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: gatex:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Compose file is valid
        run: docker compose config --quiet

      - name: Start the image with scripted demo models
        run: docker run -d --name gatex -p 4000:4000 -e MOCK_LLM=1 -e DB_MODE=memory gatex:ci

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Smoke test (health, one full check, the three reports)
        run: node scripts/smokeTest.mjs http://localhost:4000 smoke-out

      - name: App log
        if: always()
        run: docker logs gatex

      - name: Keep the report this build produced
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gatex-sample-report
          path: smoke-out/
          if-no-files-found: ignore
          retention-days: 14

  # Dependencies with a known serious problem, and keys that should never be in the repo.
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Audit production dependencies (high and critical fail the build)
        run: npm audit --omit=dev --audit-level=high

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
