<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="GateX checks your work against a scorecard. Three examiners and a final reviewer mark it and tell you what to fix." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Set the theme before the page paints, so a light-theme visitor never sees a dark flash.
      try {
        var saved = localStorage.getItem('ddd-theme');
        var light = saved ? saved === 'light' : window.matchMedia('(prefers-color-scheme: light)').matches;
        document.documentElement.dataset.theme = light ? 'light' : 'dark';
      } catch (e) {}
    </script>
    <title>GateX</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
